# 개인 청약 프로필 — 이 파일을 profile.yaml 로 복사한 뒤 값만 바꾸세요.
# 모르는 값은 비워두거나 null 로 두면 매칭에서 "판단 보류"로 처리됩니다.
# 자격·순위·규제의 최종 판단은 반드시 최신 청약홈/뉴홈 공고 원문으로 확인하세요.

# ── 주택 보유 ──
household_status: 무주택세대주       # 무주택세대주 | 무주택세대원 | 1주택 | 다주택
homeless_period_years: null          # 무주택 기간(년). 가점 32점=15년+

# ── 세대 구성 (특별공급 자격) ── 해당되는 것만 남기세요
household_types:
  # - 신혼부부        # 혼인신고 7년 이내
  # - 예비신혼        # 혼인신고 전(공공 신혼특공만)
  # - 신생아          # 공고일 기준 2년 이내 출생 자녀
  # - 미성년자녀
  # - 다자녀          # 미성년 자녀 2명 이상 (2023.3 완화)
  # - 노부모부양      # 만65세↑ 3년 이상 부양, 세대주만 가능
  # - 청년            # 만19~39세 미혼 무주택 (공공주택 특공만)
  # - 1인가구         # 미혼 단독
  # - 생애최초        # 세대 전원 과거 주택소유 이력 없음 + 소득세 5년↑ 납부
dependents_count: null               # 부양가족 수. 가점 35점=7인+
income_tax_years: null               # (생애최초) 소득세 납부 연수. 5 미만이면 생애최초 제외
won_within_5y: false                 # 최근 5년 내 세대 청약 당첨 이력 → 규제지역 1순위 강등

# ── 청약통장 ──
account_type: 종합저축               # 종합저축 | 청약예금 | 청약부금(85㎡ 이하만) | 없음
account_join_years: null             # 가입 기간(년). 가점 17점=15년+. 1순위: 비규제 1년·규제 2년
account_payment_count: null          # 납입 횟수(회). 국민 1순위: 비규제 12회·규제 24회
account_total_manwon: null           # 납입 인정액 총액(만원). 국민주택 저축총액
account_monthly_manwon: null         # 월 납입액(만원): 10 또는 25 (2026 인정한도 상향)
spouse_account_join_years: null      # (선택) 배우자 통장 가입기간(년). 민영 가점 최대 +3점 합산

# ── 비아파트 보유 (무주택 인정 판단) ──  2026 완화: 전용85㎡·공시 수도권5억(지방3억)↓ 무주택
non_apt_property: null               # (선택) 빌라/오피 보유 시 {area_m2: 59, gongsi_manwon: 30000}

# ── 소득 ──
income_level: 모름                   # 기준소득이하 | 기준소득초과 | 모름

# ── 자금·거주지 ──
residence_area: 서울                 # 주민등록 거주지: 서울 | 광역시 | 기타(경기 등). 민영 예치금 기준표 선택
deposit_capacity_manwon: null        # 통장 예치금(만원). 민영 1순위 기준: 서울 85㎡↓300·102↓600·135↓1000·모든면적 1500

# ── 관심 조건 ──
regions:                             # 관심 수도권 세부지역. 비우면 수도권 전체
  - 서울
  - 경기
  - 인천
area_pref: []                        # 선호 전용면적(㎡). 비우면 전체 (예: [59, 84])
purpose: 둘다                        # 실거주 | 시세차익 | 둘다

# ── 전략 성향 ──
strategy_aggressive: true            # 빈집털이(애매평형/타워형/뒷알파벳/소수세대) 신호 노출 여부
